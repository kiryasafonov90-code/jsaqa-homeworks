name: Puppeteer and Cucumber tests

on:
  push:
    paths:
      - "7-05/**"
  pull_request:
    paths:
      - "7-05/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 7-05
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - name: Run Puppeteer and Cucumber tests
        run: npm test
