name: JSAQA 7-05 Puppeteer and Cucumber

on:
  push:
    paths:
      - "7-05/**"
      - ".github/workflows/jsaqa-7-05.yml"
  pull_request:
    paths:
      - "7-05/**"
      - ".github/workflows/jsaqa-7-05.yml"
  workflow_dispatch:
    inputs:
      live:
        description: "Also run on live qamid.tmweb.ru (requires website access)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 7-05
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - name: Run both suites twice on local fixture with 12 occupied seats
        env:
          BASE_URL: http://127.0.0.1:8765/index.html
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory tests/fixtures >/tmp/cinema-test-server.log 2>&1 &
          npm test
          npm test
      - name: Run live cinema tests (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
        run: npm test
